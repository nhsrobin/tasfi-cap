name: Build Tasfi Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Tasfi Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Node dependencies
        run: npm ci

      # The project package.json currently has Capacitor Core and CLI,
      # but does not list @capacitor/android. Install the matching v8 package
      # in the runner without changing package.json or package-lock.json.
      - name: Install Capacitor Android
        run: npm install --no-save --package-lock=false @capacitor/android@^8.6.0

      - name: Build React and Vite app
        run: npm run build

      # Reuse the checked-in Android project if it already exists.
      # Only create it on a fresh repository where android/ is absent.
      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists; skipping cap add."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tasfi-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
