name: Build Tasfi Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Tasfi Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Use v4 and install only platform-tools; do not request the removed legacy "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install project dependencies
        run: npm ci

      # Install the Android platform package matching this project's Capacitor v8 setup.
      - name: Install Capacitor Android
        run: npm install --no-save --package-lock=false @capacitor/android@^8.6.0

      - name: Build web app
        run: npm run build

      # Reuse an existing Android project; create it only when absent.
      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ already exists; skipping cap add."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasfi-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
